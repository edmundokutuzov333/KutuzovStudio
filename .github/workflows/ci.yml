name: Studio CI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: for f in src/*.mjs; do node --check "$f"; done
      - name: Browser smoke (Chrome)
        run: |
          python3 -m http.server 8000 > /tmp/studio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom http://localhost:8000/tests/browser.html > /tmp/studio-browser.html
          grep -q 'STUDIO_BROWSER_PASS' /tmp/studio-browser.html
