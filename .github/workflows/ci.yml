name: Studio CI
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - run: for f in src/*.mjs tests/*.mjs sw.js; do node --check "$f"; done
      - name: Prepare browser environment
        run: python3 -m venv /tmp/studio-venv
      - name: Browser smoke (real-time Playwright)
        run: |
          /tmp/studio-venv/bin/pip install playwright==1.51.0
          /tmp/studio-venv/bin/python -m playwright install chromium
          python3 -m http.server 8000 > /tmp/studio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          /tmp/studio-venv/bin/python tests/browser_smoke.py
  print-proof:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install proof tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils inkscape zbar-tools
      - name: Install vector PDF dependency
        run: python3 -m venv /tmp/studio-venv && /tmp/studio-venv/bin/pip install pypdf==5.9.0
      - name: Vector PDF proof
        run: |
          node tests/vector-proof.mjs /tmp/studio-vector.html
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=/tmp/studio-vector.pdf file:///tmp/studio-vector.html
          pdfinfo /tmp/studio-vector.pdf | grep -Eq '^Pages: +2$'
          pdftotext /tmp/studio-vector.pdf - | grep -F 'Ana João'
          pdffonts /tmp/studio-vector.pdf | grep -Eq 'yes +yes +yes'
      - name: Offline CMYK conversion proof
        run: |
          node tests/pdfx-fixture.mjs /tmp/studio-rgb.pdf
          profile=$(find /usr/share/color/icc -name default_cmyk.icc -print -quit)
          test -n "$profile"
          /tmp/studio-venv/bin/python tools/pdfx.py /tmp/studio-rgb.pdf "$profile" /tmp/studio-cmyk.pdf --condition 'CI SWOP test only'
      - name: Exact vector PDF and ICC conversion
        run: |
          /tmp/studio-venv/bin/python tests/vector-gradient-security.py
          node tests/vector-cli-fixture.mjs /tmp/studio-vector-source
          /tmp/studio-venv/bin/python tools/vector_pdf.py /tmp/studio-vector-source/front.svg /tmp/studio-vector-source/back.svg /tmp/studio-vector-source/PRINT-SPEC.json /tmp/studio-vector-exact.pdf
          pdftotext /tmp/studio-vector-exact.pdf - | grep -F 'Ana João'
          profile=$(find /usr/share/color/icc -name default_cmyk.icc -print -quit)
          /tmp/studio-venv/bin/python tools/pdfx.py /tmp/studio-vector-exact.pdf "$profile" /tmp/studio-vector-cmyk.pdf --condition 'CI SWOP test only'
      - name: Independent QR and Code 39 scan proof
        run: |
          node tests/scan-fixture.mjs /tmp/studio-scan
          for image in /tmp/studio-scan/*.pgm; do
            zbarimg --quiet --raw "$image" > "${image%.pgm}.actual"
            cmp "${image%.pgm}.txt" "${image%.pgm}.actual"
          done
  postgres-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: studio_ci_only
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: studio_ci_only
      PGDATABASE: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon nologin; create role authenticated nologin;'
          psql -v ON_ERROR_STOP=1 -f tests/postgres-auth-stub.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/catalog_permissions.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/editorial_permissions.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/asset_permissions.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/editorial_draft.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/editor_membership.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_search_budget.sql
      - name: Catalog parity
        run: |
          psql -At -v ON_ERROR_STOP=1 -c 'select json_agg(t) from (select id,product,label,width_mm,height_mm,bleed_mm,safe_mm,position from public.studio_formats where published) t' > /tmp/catalog.json
          node tests/catalog-parity.mjs /tmp/catalog.json
  live-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node tests/live-catalog.mjs
  browser-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install browser
        run: |
          python3 -m venv /tmp/compat
          /tmp/compat/bin/pip install playwright==1.51.0
          /tmp/compat/bin/python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare art proof gallery
        if: matrix.browser == 'chromium'
        run: node tests/art-gallery.mjs tests/art-proof
      - name: Browser end-to-end
        run: |
          python3 -m http.server 8000 > /tmp/studio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          /tmp/compat/bin/python tests/browser_compatibility.py ${{ matrix.browser }}
      - name: Visual QA captures
        if: matrix.browser == 'chromium' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-ui-screenshots
          path: /tmp/studio-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Editorial interface contract (mocked authentication)
        if: matrix.browser == 'chromium'
        run: |
          python3 -m http.server 8000 > /tmp/studio-admin-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          /tmp/compat/bin/python tests/admin_browser.py
  template-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install local import engines
        run: |
          sudo apt-get update && sudo apt-get install -y inkscape ghostscript
          python3 -m venv /tmp/studio-import
          /tmp/studio-import/bin/pip install -r tools/import-requirements.txt playwright==1.51.0
          /tmp/studio-import/bin/python -m playwright install chromium
      - name: Verify real source formats and safe pack
        run: |
          mkdir -p /tmp/studio-import-proof
          curl -fsSL https://raw.githubusercontent.com/psd-tools/psd-tools/b5637927626c7e577ffb5b8925901fc9d06c69f9/tests/psd_files/layers-minimal/type-layer.psd -o /tmp/studio-import-proof/type-layer.psd
          /tmp/studio-import/bin/python tests/template_import_proof.py /tmp/studio-import-proof /tmp/studio-import-proof/type-layer.psd
          node --input-type=module -e "import {parsePack} from './src/template-runtime.mjs';import {readFileSync} from 'node:fs';parsePack(readFileSync('/tmp/studio-import-proof/proof.kutuzov-template','utf8'));"
      - name: Browser proof with generated pack
        run: |
          npm run build
          python3 -m http.server 8002 --directory dist > /tmp/studio-template-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8002/templates.html >/dev/null && break; sleep 1; done
          /tmp/studio-import/bin/python tests/template_import_browser.py /tmp/studio-import-proof/proof.kutuzov-template
  native-kutuzov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native AI preservation proof
        run: |
          mkdir -p /tmp/native-proof
          curl -fsSL https://raw.githubusercontent.com/jimbobbennett/BusinessCards/ce914f1bb15dcd1e38a863252d870adeb817179d/business-card-cda-front.ai -o /tmp/real-card.ai
          curl -fsSL https://raw.githubusercontent.com/jimbobbennett/BusinessCards/ce914f1bb15dcd1e38a863252d870adeb817179d/LICENSE -o /tmp/native-proof/LICENSE.txt
          node tests/native_proof.mjs /tmp/real-card.ai /tmp/native-proof
          cmp /tmp/real-card.ai /tmp/native-proof/cartao-teste.kutuzov
          cp tools/open-kutuzov.jsx /tmp/native-proof/
          python3 -m venv /tmp/native-qa
          /tmp/native-qa/bin/pip install playwright==1.51.0
          /tmp/native-qa/bin/python -m playwright install chromium
          npm run build
          python3 -m http.server 8003 --directory dist > /tmp/studio-native-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8003/native.html >/dev/null && break; sleep 1; done
          /tmp/native-qa/bin/python tests/native_browser.py /tmp/real-card.ai
          printf '%s\n' 'Original MIT fixture: Jim Bennett / BusinessCards. Template credited to Anthony Chu and Alex Karcher; artwork credited to Ashley McNamara. For interoperability testing only; not a Kutuzov Studio catalogue design.' > /tmp/native-proof/ATTRIBUTION.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-kutuzov-card
          path: /tmp/native-proof/
          if-no-files-found: error
          retention-days: 30
  release-artifact:
    needs: [application, print-proof, postgres-contract, live-catalog, browser-compatibility, template-import, native-kutuzov]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          STUDIO_PUBLIC_ORIGIN: https://kutuzov-studio.vercel.app
      - name: Install browser for release artifact verification
        run: |
          python3 -m venv /tmp/release-qa
          /tmp/release-qa/bin/pip install playwright==1.51.0 pypdf==5.9.0
          /tmp/release-qa/bin/python -m playwright install chromium
      - name: Offline, batch, privacy and release build
        run: |
          python3 -m http.server 8001 --directory dist > /tmp/studio-release-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://localhost:8001/health.json >/dev/null && break; sleep 1; done
          /tmp/release-qa/bin/python tests/release_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
